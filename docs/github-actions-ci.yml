# CI for continual-learning-platform.
# NOTE: activate by moving this file to .github/workflows/ci.yml
# (the publishing integration lacks the Workflows permission, so the
# workflow cannot live under .github/workflows/ in this repo directly).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q
