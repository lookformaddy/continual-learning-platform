[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-learning-platform"
version = "0.1.0"
description = "Continual / online learning platform for tabular models: drift detection, replay, gated retraining, versioned snapshots."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
